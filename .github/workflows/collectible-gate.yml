# The collectible vetting gate decides what may become loan collateral.
# A loosened rule wouldn't fail a type check or a build — it would just quietly
# start saying yes. This runs the gate against the rules we decided on purpose.
name: collectible-gate
on:
  pull_request:
    paths:
      - "src/lib/collectible-vetting.ts"
      - "scripts/check-collectible-gate.mjs"
      - ".github/workflows/collectible-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/collectible-vetting.ts"
      - "scripts/check-collectible-gate.mjs"
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step — the guard is dependency-free on purpose, so it can
      # never be skipped because a lockfile broke.
      - run: node --experimental-strip-types scripts/check-collectible-gate.mjs
